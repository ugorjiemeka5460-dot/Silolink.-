name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Unzip app code
        run: unzip -q silolink_flutter_app.zip
      - name: Create native scaffold
        run: flutter create --platforms=android --org com.silolink --project-name silolink_app scaffold
      - name: Add android folder
        run: cp -r scaffold/android silolink_app/android
      - name: Strip spaces from phone number input
        run: sed -i "s/var digits = _phoneController.text.trim();/var digits = _phoneController.text.trim().replaceAll(' ', '');/" silolink_app/lib/screens/auth/phone_entry_screen.dart
      - name: Fix booking provider stream type
        run: sed -i 's/Stream driverLocationStream/Stream<DocumentSnapshot<Map<String, dynamic>>> driverLocationStream/' silolink_app/lib/providers/booking_provider.dart
      - name: Add missing Firestore import
        run: sed -i "1i import 'package:cloud_firestore/cloud_firestore.dart';" silolink_app/lib/providers/booking_provider.dart
      - name: Add timeout and error visibility to auth
        run: |
          cat > silolink_app/lib/providers/auth_provider.dart << 'EOF'
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:flutter/foundation.dart';
          import '../models/user_model.dart';
          import '../services/auth_service.dart';
          import '../services/firestore_service.dart';
          import '../utils/constants.dart';

          class AuthProvider extends ChangeNotifier {
            final AuthService _authService = AuthService();
            final FirestoreService _firestoreService = FirestoreService();

            AppUser? currentAppUser;
            User? firebaseUser;
            String? verificationId;
            bool isLoading = false;
            String? errorMessage;

            AuthProvider() {
              _authService.authStateChanges.listen((user) async {
                firebaseUser = user;
                if (user != null) {
                  currentAppUser = await _firestoreService.getUser(user.uid);
                } else {
                  currentAppUser = null;
                }
                notifyListeners();
              });
            }

            bool get isLoggedIn => firebaseUser != null;
            bool get hasProfile => currentAppUser != null;

            Future<void> sendOtp(String phoneNumber) async {
              isLoading = true;
              errorMessage = null;
              notifyListeners();
              try {
                await _authService.sendOtp(
                  phoneNumber: phoneNumber,
                  onCodeSent: (id) {
                    verificationId = id;
                    isLoading = false;
                    notifyListeners();
                  },
                  onError: (msg) {
                    errorMessage = msg;
                    isLoading = false;
                    notifyListeners();
                  },
                  onAutoVerified: (credential) {
                    isLoading = false;
                    notifyListeners();
                  },
                ).timeout(const Duration(seconds: 15));
              } catch (e) {
                errorMessage = "Timed out or failed: $e";
                isLoading = false;
                notifyListeners();
              }
            }

            Future<bool> verifyOtpAndCreateProfile({
              required String smsCode,
              required String name,
              required UserRole role,
            }) async {
              if (verificationId == null) {
                errorMessage = "Please request a code first.";
                notifyListeners();
                return false;
              }
              isLoading = true;
              errorMessage = null;
              notifyListeners();
              try {
                final result = await _authService.verifyOtp(
                  verificationId: verificationId!,
                  smsCode: smsCode,
                ).timeout(const Duration(seconds: 15));
                final uid = result.user!.uid;
                final phone = result.user!.phoneNumber ?? "";
                final existing = await _firestoreService.getUser(uid)
                    .timeout(const Duration(seconds: 15));
                if (existing == null) {
                  final newUser = AppUser(uid: uid, name: name, phone: phone, role: role);
                  await _firestoreService.createOrUpdateUser(newUser)
                      .timeout(const Duration(seconds: 15));
                  currentAppUser = newUser;
                } else {
                  currentAppUser = existing;
                }
                isLoading = false;
                notifyListeners();
                return true;
              } on FirebaseAuthException catch (e) {
                errorMessage = e.message ?? "Invalid code. Please try again.";
                isLoading = false;
                notifyListeners();
                return false;
              } catch (e) {
                errorMessage = "Timed out or failed: $e";
                isLoading = false;
                notifyListeners();
                return false;
              }
            }

            Future<bool> testSignIn(String name, UserRole role) async {
              isLoading = true;
              errorMessage = null;
              notifyListeners();
              try {
                final cred = await FirebaseAuth.instance.signInAnonymously()
                    .timeout(const Duration(seconds: 15));
                final uid = cred.user!.uid;
                final newUser = AppUser(uid: uid, name: name, phone: "test", role: role);
                await _firestoreService.createOrUpdateUser(newUser);
                currentAppUser = newUser;
                isLoading = false;
                notifyListeners();
                return true;
              } catch (e) {
                errorMessage = "Test sign-in failed: $e";
                isLoading = false;
                notifyListeners();
                return false;
              }
            }

            Future<void> refreshProfile() async {
              if (firebaseUser == null) return;
              currentAppUser = await _firestoreService.getUser(firebaseUser!.uid);
              notifyListeners();
            }

            Future<void> signOut() async {
              await _authService.signOut();
              currentAppUser = null;
              firebaseUser = null;
              notifyListeners();
            }
          }
          EOF
      - name: Add skip sign-in button to role screen
        run: |
          python3 - << 'PYEOF'
          path = "silolink_app/lib/screens/auth/role_selection_screen.dart"
          content = open(path).read()
          content = content.replace(
              "import 'phone_entry_screen.dart';",
              "import 'phone_entry_screen.dart';\nimport 'package:provider/provider.dart';\nimport '../../providers/auth_provider.dart';\nimport '../farmer/farmer_home_screen.dart';"
          )
          content = content.replace(
              "            ],\n          ),\n        ),\n      ),\n    );\n  }\n\n  void _goToPhoneEntry",
              """              const SizedBox(height: 24),
              Center(
                child: TextButton(
                  onPressed: () async {
                    final auth = context.read<AuthProvider>();
                    final ok = await auth.testSignIn("Test Farmer", UserRole.farmer);
                    if (ok && context.mounted) {
                      Navigator.of(context).pushAndRemoveUntil(
                        MaterialPageRoute(builder: (_) => const FarmerHomeScreen()),
                        (route) => false,
                      );
                    }
                  },
                  child: const Text("Just testing? Skip sign-in"),
                ),
              ),
            ],
          ),
        ),
      ),
    );
  }

  void _goToPhoneEntry"""
          )
          open(path, "w").write(content)
          PYEOF
      - name: Fill in Firebase config
        run: |
          cat > silolink_app/lib/firebase_options.dart << 'EOF'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => android;
            static const FirebaseOptions android = FirebaseOptions(
              apiKey: 'AIzaSyD_X33l4igxIWyvyX0QirvGN3221cSwzOc',
              appId: '1:254026128719:android:ad4ac1884744210cd9f93a',
              messagingSenderId: '254026128719',
              projectId: 'silolink',
              storageBucket: 'silolink.firebasestorage.app',
            );
          }
          EOF
      - name: Remove Paystack dependency
        run: sed -i '/paystack_sdk_flutter/d' silolink_app/pubspec.yaml
      - name: Stub out Paystack service
        run: |
          cat > silolink_app/lib/services/paystack_service.dart << 'EOF'
          class PaystackService {
            Future<void> initialize(String publicKey) async {}
            Future<String?> chargeCard({
              required String email,
              required double amountNaira,
              required String reference,
            }) async {
              return null;
            }
          }
          EOF
      - name: Get packages
        working-directory: silolink_app
        run: flutter pub get
      - name: Build APK
        working-directory: silolink_app
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: silolink-apk
          path: silolink_app/build/app/outputs/flutter-apk/app-release.apk
      - name: Print SHA-1 fingerprint
        working-directory: silolink_app/android
        run: ./gradlew signingReport
