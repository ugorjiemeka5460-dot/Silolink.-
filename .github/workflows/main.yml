name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Unzip app code
        run: unzip -q silolink_flutter_app.zip
      - name: Create native scaffold
        run: flutter create --platforms=android --org com.silolink --project-name silolink_app scaffold
      - name: Add android folder
        run: cp -r scaffold/android silolink_app/android
      - name: Strip spaces from phone number input
        run: sed -i "s/var digits = _phoneController.text.trim();/var digits = _phoneController.text.trim().replaceAll(' ', '');/" silolink_app/lib/screens/auth/phone_entry_screen.dart
      - name: Fix booking provider stream type
        run: sed -i 's/Stream driverLocationStream/Stream<DocumentSnapshot<Map<String, dynamic>>> driverLocationStream/' silolink_app/lib/providers/booking_provider.dart
      - name: Add missing Firestore import
        run: sed -i "1i import 'package:cloud_firestore/cloud_firestore.dart';" silolink_app/lib/providers/booking_provider.dart
      - name: Fix Firestore composite index queries
        run: |
          cat > silolink_app/lib/services/firestore_service.dart << 'EOF'
          import 'package:cloud_firestore/cloud_firestore.dart';
          import '../models/user_model.dart';
          import '../models/produce_model.dart';
          import '../models/order_model.dart';
          import '../models/booking_model.dart';
          import '../utils/constants.dart';

          class FirestoreService {
            final FirebaseFirestore _db = FirebaseFirestore.instance;

            Future<void> createOrUpdateUser(AppUser user) {
              return _db.collection(AppConstants.usersCollection).doc(user.uid).set(
                    user.toMap(),
                    SetOptions(merge: true),
                  );
            }

            Future<AppUser?> getUser(String uid) async {
              final doc = await _db.collection(AppConstants.usersCollection).doc(uid).get();
              if (!doc.exists) return null;
              return AppUser.fromMap(uid, doc.data()!);
            }

            Stream<AppUser?> streamUser(String uid) {
              return _db.collection(AppConstants.usersCollection).doc(uid).snapshots().map(
                    (doc) => doc.exists ? AppUser.fromMap(uid, doc.data()!) : null,
                  );
            }

            Future<String> addProduce(Produce produce) async {
              final ref = await _db.collection(AppConstants.produceCollection).add(produce.toMap());
              return ref.id;
            }

            Stream<List<Produce>> streamAvailableProduce({String? cropFilter}) {
              return _db
                  .collection(AppConstants.produceCollection)
                  .where('status', isEqualTo: 'available')
                  .snapshots()
                  .map((snap) {
                var items = snap.docs.map((d) => Produce.fromDoc(d)).toList();
                items.sort((a, b) => (b.createdAt ?? DateTime(0)).compareTo(a.createdAt ?? DateTime(0)));
                if (cropFilter != null && cropFilter.trim().isNotEmpty) {
                  final q = cropFilter.toLowerCase();
                  items = items.where((p) => p.crop.toLowerCase().contains(q)).toList();
                }
                return items;
              });
            }

            Stream<List<Produce>> streamFarmerProduce(String farmerId) {
              return _db
                  .collection(AppConstants.produceCollection)
                  .where('farmerId', isEqualTo: farmerId)
                  .snapshots()
                  .map((snap) {
                var items = snap.docs.map((d) => Produce.fromDoc(d)).toList();
                items.sort((a, b) => (b.createdAt ?? DateTime(0)).compareTo(a.createdAt ?? DateTime(0)));
                return items;
              });
            }

            Future<void> markProduceSold(String produceId) {
              return _db.collection(AppConstants.produceCollection).doc(produceId).update({'status': 'sold'});
            }

            Future<String> createOrder(OrderModel order) async {
              final ref = await _db.collection(AppConstants.ordersCollection).add(order.toMap());
              return ref.id;
            }

            Future<void> updateOrderStatus(String orderId, OrderStatus status, {String? paymentRef}) {
              final data = <String, dynamic>{'status': status.name};
              if (paymentRef != null) data['paymentRef'] = paymentRef;
              return _db.collection(AppConstants.ordersCollection).doc(orderId).update(data);
            }

            Stream<List<OrderModel>> streamBuyerOrders(String buyerId) {
              return _db
                  .collection(AppConstants.ordersCollection)
                  .where('buyerId', isEqualTo: buyerId)
                  .snapshots()
                  .map((snap) {
                var items = snap.docs.map((d) => OrderModel.fromDoc(d)).toList();
                items.sort((a, b) => (b.createdAt ?? DateTime(0)).compareTo(a.createdAt ?? DateTime(0)));
                return items;
              });
            }

            Stream<List<OrderModel>> streamFarmerOrders(String farmerId) {
              return _db
                  .collection(AppConstants.ordersCollection)
                  .where('farmerId', isEqualTo: farmerId)
                  .snapshots()
                  .map((snap) {
                var items = snap.docs.map((d) => OrderModel.fromDoc(d)).toList();
                items.sort((a, b) => (b.createdAt ?? DateTime(0)).compareTo(a.createdAt ?? DateTime(0)));
                return items;
              });
            }

            Stream<List<OrderModel>> streamPendingLeadsForFarmer(String farmerId) {
              return _db
                  .collection(AppConstants.ordersCollection)
                  .where('farmerId', isEqualTo: farmerId)
                  .where('status', isEqualTo: OrderStatus.pending.name)
                  .snapshots()
                  .map((snap) {
                var items = snap.docs.map((d) => OrderModel.fromDoc(d)).toList();
                items.sort((a, b) => (b.createdAt ?? DateTime(0)).compareTo(a.createdAt ?? DateTime(0)));
                return items;
              });
            }

            Future<String> createBooking(BookingModel booking) async {
              final ref = await _db.collection(AppConstants.bookingsCollection).add(booking.toMap());
              return ref.id;
            }

            Stream<List<BookingModel>> streamAvailableBookings() {
              return _db
                  .collection(AppConstants.bookingsCollection)
                  .where('status', isEqualTo: BookingStatus.requested.name)
                  .snapshots()
                  .map((snap) {
                var items = snap.docs.map((d) => BookingModel.fromDoc(d)).toList();
                items.sort((a, b) => (b.createdAt ?? DateTime(0)).compareTo(a.createdAt ?? DateTime(0)));
                return items;
              });
            }

            Stream<List<BookingModel>> streamDriverTrips(String driverId) {
              return _db
                  .collection(AppConstants.bookingsCollection)
                  .where('driverId', isEqualTo: driverId)
                  .snapshots()
                  .map((snap) {
                var items = snap.docs.map((d) => BookingModel.fromDoc(d)).toList();
                items.sort((a, b) => (b.createdAt ?? DateTime(0)).compareTo(a.createdAt ?? DateTime(0)));
                return items;
              });
            }

            Stream<List<BookingModel>> streamRequesterBookings(String requesterId) {
              return _db
                  .collection(AppConstants.bookingsCollection)
                  .where('requesterId', isEqualTo: requesterId)
                  .snapshots()
                  .map((snap) {
                var items = snap.docs.map((d) => BookingModel.fromDoc(d)).toList();
                items.sort((a, b) => (b.createdAt ?? DateTime(0)).compareTo(a.createdAt ?? DateTime(0)));
                return items;
              });
            }

            Stream<BookingModel?> streamBooking(String bookingId) {
              return _db.collection(AppConstants.bookingsCollection).doc(bookingId).snapshots().map(
                    (doc) => doc.exists ? BookingModel.fromDoc(doc) : null,
                  );
            }

            Future<bool> acceptBooking({
              required String bookingId,
              required String driverId,
              required String driverName,
            }) {
              final ref = _db.collection(AppConstants.bookingsCollection).doc(bookingId);
              return _db.runTransaction<bool>((tx) async {
                final snap = await tx.get(ref);
                if (!snap.exists) return false;
                final currentStatus = snap.data()?['status'];
                if (currentStatus != BookingStatus.requested.name) return false;
                tx.update(ref, {
                  'status': BookingStatus.accepted.name,
                  'driverId': driverId,
                  'driverName': driverName,
                });
                return true;
              });
            }

            Future<void> updateBookingStatus(String bookingId, BookingStatus status) {
              return _db.collection(AppConstants.bookingsCollection).doc(bookingId).update({'status': status.name});
            }

            Future<void> updateDriverLocation(String driverId, double lat, double lng) {
              return _db.collection(AppConstants.driverLocationsCollection).doc(driverId).set({
                'lat': lat,
                'lng': lng,
                'timestamp': FieldValue.serverTimestamp(),
              });
            }

            Stream<DocumentSnapshot<Map<String, dynamic>>> streamDriverLocation(String driverId) {
              return _db.collection(AppConstants.driverLocationsCollection).doc(driverId).snapshots();
            }
          }
          EOF
      - name: Add timeout and error visibility to auth
        run: |
          cat > silolink_app/lib/providers/auth_provider.dart << 'EOF'
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:flutter/foundation.dart';
          import '../models/user_model.dart';
          import '../services/auth_service.dart';
          import '../services/firestore_service.dart';
          import '../utils/constants.dart';

          class AuthProvider extends ChangeNotifier {
            final AuthService _authService = AuthService();
            final FirestoreService _firestoreService = FirestoreService();

            AppUser? currentAppUser;
            User? firebaseUser;
            String? verificationId;
            bool isLoading = false;
            String? errorMessage;

            AuthProvider() {
              _authService.authStateChanges.listen((user) async {
                firebaseUser = user;
                if (user != null) {
                  currentAppUser = await _firestoreService.getUser(user.uid);
                } else {
                  currentAppUser = null;
                }
                notifyListeners();
              });
            }

            bool get isLoggedIn => firebaseUser != null;
            bool get hasProfile => currentAppUser != null;

            Future<void> sendOtp(String phoneNumber) async {
              isLoading = true;
              errorMessage = null;
              notifyListeners();
              try {
                await _authService.sendOtp(
                  phoneNumber: phoneNumber,
                  onCodeSent: (id) {
                    verificationId = id;
                    isLoading = false;
                    notifyListeners();
                  },
                  onError: (msg) {
                    errorMessage = msg;
                    isLoading = false;
                    notifyListeners();
                  },
                  onAutoVerified: (credential) {
                    isLoading = false;
                    notifyListeners();
                  },
                ).timeout(const Duration(seconds: 15));
              } catch (e) {
                errorMessage = "Timed out or failed: $e";
                isLoading = false;
                notifyListeners();
              }
            }

            Future<bool> verifyOtpAndCreateProfile({
              required String smsCode,
              required String name,
              required UserRole role,
            }) async {
              if (verificationId == null) {
                errorMessage = "Please request a code first.";
                notifyListeners();
                return false;
              }
              isLoading = true;
              errorMessage = null;
              notifyListeners();
              try {
                final result = await _authService.verifyOtp(
                  verificationId: verificationId!,
                  smsCode: smsCode,
                ).timeout(const Duration(seconds: 15));
                final uid = result.user!.uid;
                final phone = result.user!.phoneNumber ?? "";
                final existing = await _firestoreService.getUser(uid)
                    .timeout(const Duration(seconds: 15));
                if (existing == null) {
                  final newUser = AppUser(uid: uid, name: name, phone: phone, role: role);
                  await _firestoreService.createOrUpdateUser(newUser)
                      .timeout(const Duration(seconds: 15));
                  currentAppUser = newUser;
                } else {
                  currentAppUser = existing;
                }
                isLoading = false;
                notifyListeners();
                return true;
              } on FirebaseAuthException catch (e) {
                errorMessage = e.message ?? "Invalid code. Please try again.";
                isLoading = false;
                notifyListeners();
                return false;
              } catch (e) {
                errorMessage = "Timed out or failed: $e";
                isLoading = false;
                notifyListeners();
                return false;
              }
            }

            Future<bool> testSignIn(String name, UserRole role) async {
              isLoading = true;
              errorMessage = null;
              notifyListeners();
              try {
                final cred = await FirebaseAuth.instance.signInAnonymously()
                    .timeout(const Duration(seconds: 15));
                final uid = cred.user!.uid;
                final newUser = AppUser(uid: uid, name: name, phone: "test", role: role);
                await _firestoreService.createOrUpdateUser(newUser);
                currentAppUser = newUser;
                isLoading = false;
                notifyListeners();
                return true;
              } catch (e) {
                errorMessage = "Test sign-in failed: $e";
                isLoading = false;
                notifyListeners();
                return false;
              }
            }

            Future<void> refreshProfile() async {
              if (firebaseUser == null) return;
              currentAppUser = await _firestoreService.getUser(firebaseUser!.uid);
              notifyListeners();
            }

            Future<void> signOut() async {
              await _authService.signOut();
              currentAppUser = null;
              firebaseUser = null;
              notifyListeners();
            }
          }
          EOF
      - name: Add skip sign-in button to role screen
        run: |
          cat > silolink_app/lib/screens/auth/role_selection_screen.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:provider/provider.dart';
          import '../../providers/auth_provider.dart';
          import '../../utils/constants.dart';
          import '../../widgets/role_card.dart';
          import '../farmer/farmer_home_screen.dart';
          import 'phone_entry_screen.dart';

          class RoleSelectionScreen extends StatelessWidget {
            const RoleSelectionScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Padding(
                    padding: const EdgeInsets.all(24),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        const SizedBox(height: 24),
                        Text("Welcome to ${AppConstants.appName}", style: Theme.of(context).textTheme.titleLarge),
                        const SizedBox(height: 8),
                        const Text(
                          "How will you be using the app?",
                          style: TextStyle(color: Colors.black54, fontSize: 15),
                        ),
                        const SizedBox(height: 28),
                        RoleCard(
                          title: "I'm a Farmer",
                          subtitle: "Post produce, find buyers, book a truck",
                          icon: Icons.agriculture,
                          onTap: () => _goToPhoneEntry(context, UserRole.farmer),
                        ),
                        const SizedBox(height: 12),
                        RoleCard(
                          title: "I'm a Buyer",
                          subtitle: "Browse produce, order, pay, and track delivery",
                          icon: Icons.storefront,
                          onTap: () => _goToPhoneEntry(context, UserRole.buyer),
                        ),
                        const SizedBox(height: 12),
                        RoleCard(
                          title: "I'm a Truck Driver",
                          subtitle: "Accept bookings and earn from deliveries",
                          icon: Icons.local_shipping,
                          onTap: () => _goToPhoneEntry(context, UserRole.driver),
                        ),
                        const SizedBox(height: 24),
                        Center(
                          child: TextButton(
                            onPressed: () async {
                              final auth = context.read<AuthProvider>();
                              final ok = await auth.testSignIn("Test Farmer", UserRole.farmer);
                              if (ok && context.mounted) {
                                Navigator.of(context).pushAndRemoveUntil(
                                  MaterialPageRoute(builder: (_) => const FarmerHomeScreen()),
                                  (route) => false,
                                );
                              }
                            },
                            child: const Text("Just testing? Skip sign-in"),
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            void _goToPhoneEntry(BuildContext context, UserRole role) {
              Navigator.of(context).push(
                MaterialPageRoute(builder: (_) => PhoneEntryScreen(role: role)),
              );
            }
          }
          EOF
      - name: Fill in Firebase config
        run: |
          cat > silolink_app/lib/firebase_options.dart << 'EOF'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => android;
            static const FirebaseOptions android = FirebaseOptions(
              apiKey: 'AIzaSyD_X33l4igxIWyvyX0QirvGN3221cSwzOc',
              appId: '1:254026128719:android:ad4ac1884744210cd9f93a',
              messagingSenderId: '254026128719',
              projectId: 'silolink',
              storageBucket: 'silolink.firebasestorage.app',
            );
          }
          EOF
      - name: Remove Paystack dependency
        run: sed -i '/paystack_sdk_flutter/d' silolink_app/pubspec.yaml
      - name: Stub out Paystack service
        run: |
          cat > silolink_app/lib/services/paystack_service.dart << 'EOF'
          class PaystackService {
            Future<void> initialize(String publicKey) async {}
            Future<String?> chargeCard({
              required String email,
              required double amountNaira,
              required String reference,
            }) async {
              return null;
            }
          }
          EOF
      - name: Get packages
        working-directory: silolink_app
        run: flutter pub get
      - name: Build APK
        working-directory: silolink_app
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: silolink-apk
          path: silolink_app/build/app/outputs/flutter-apk/app-release.apk
      - name: Print SHA-1 fingerprint
        working-directory: silolink_app/android
        run: ./gradlew signingReport
